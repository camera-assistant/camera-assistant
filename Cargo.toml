[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/camera-assistant/camera-assistant"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4.6.10", features = ["derive"] }
